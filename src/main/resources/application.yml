server:
  servlet:
    session:
      cookie:
        name: MEDLINKSESSION
        http-only: true                  # JS 접근 차단(보안)
        secure: ${SESSION_COOKIE_SECURE:false}  # HTTPS만 전송(운영 true 권장)
        same-site: ${SESSION_SAMESITE:Lax}      # Lax -> 같은 호스트 url 가능

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # JDBC_URL=jdbc:mysql://localhost:3306/{스키마명}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    url: ${JDBC_URL:jdbc:mysql://localhost:3306/medlink?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}  # none|validate|update|create|create-drop
      dialect: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  session:
    store-type: redis       # ← 세션을 redis에 저장
    timeout: 60m              # ← 세션 타임아웃 60분
    redis:
      namespace: medlink:sessions  # 키 prefix

  data:
    redis:
      host: localhost
      port: 6379

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:5174}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:371a027cd1dac68dce2424d2ac0fd3ca}

  mobility:
    rest-api-key: ${KAKAO_MOBILITY_REST_API_KEY:af11d187f48df0ed2268e7e2afbbfc45}


logging:
  level:
    org.hibernate.SQL: DEBUG

swagger:
  auth:
    whitelist: "/login,/logout,/health"
springdoc:
  swagger-ui:
    doc-expansion: none
    persist-authorization: true # 브라우저 탭 내 인증 유지