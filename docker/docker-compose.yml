version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: hospital-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1111
      MYSQL_DATABASE: hospital
      MYSQL_USER: root
      MYSQL_PASSWORD: 1111
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./initdb/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./initdb/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro

volumes:
  db-data: